<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ZakaCoding logo transition prototype</title>
  <desc id="desc">The ZakaCoding logo travels from the first portfolio panel into the About panel.</desc>

  <defs>
    <linearGradient id="pageGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f4fb"/>
    </linearGradient>
    <linearGradient id="aboutGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#dce8ff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#162033" flood-opacity=".16"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#162033" flood-opacity=".13"/>
    </filter>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; }
      .muted { fill: #8c96a5; }
      .logo-flight {
        transform-box: fill-box;
        transform-origin: 0 0;
        animation: fly 4.8s cubic-bezier(.22, 1, .36, 1) infinite;
      }
      .logo-flight-shadow {
        transform-box: fill-box;
        transform-origin: 0 0;
        animation: flyShadow 4.8s cubic-bezier(.22, 1, .36, 1) infinite;
      }
      .target-logo { animation: target 4.8s ease-in-out infinite; }
      .trail { animation: trail 4.8s ease-in-out infinite; }

      @keyframes fly {
        0%, 8% { transform: translate(0, 0) scale(1.34) rotate(0deg); opacity: 1; }
        20% { transform: translate(210px, -85px) scale(1.22) rotate(-3deg); opacity: 1; }
        72% { transform: translate(865px, -325px) scale(.62) rotate(4deg); opacity: 1; }
        87%, 100% { transform: translate(1080px, -370px) scale(.39) rotate(0deg); opacity: 0; }
      }
      @keyframes flyShadow {
        0%, 8% { transform: translate(0, 0) scale(1.34); opacity: .28; }
        20% { transform: translate(210px, -85px) scale(1.22); opacity: .2; }
        72% { transform: translate(865px, -325px) scale(.62); opacity: .1; }
        87%, 100% { transform: translate(1080px, -370px) scale(.39); opacity: 0; }
      }
      @keyframes target {
        0%, 72% { opacity: 0; transform: translateY(8px) scale(.8); }
        87%, 100% { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes trail {
        0%, 12%, 88%, 100% { opacity: 0; stroke-dashoffset: 1100; }
        22%, 68% { opacity: .22; stroke-dashoffset: 220; }
      }
      @media (prefers-reduced-motion: reduce) {
        .logo-flight, .logo-flight-shadow, .target-logo, .trail { animation: none; }
        .logo-flight { transform: translate(1080px, -370px) scale(.39); opacity: 0; }
        .logo-flight-shadow, .trail { opacity: 0; }
        .target-logo { opacity: 1; transform: none; }
      }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#eef1f7"/>

  <!-- First panel -->
  <rect x="54" y="52" width="880" height="796" rx="26" fill="url(#pageGlow)" stroke="#dce1eb"/>
  <g class="ui">
    <text x="110" y="142" font-size="70" font-weight="720" letter-spacing="-5" fill="#213448">ZakaCoding</text>
    <text x="530" y="126" class="muted" font-size="17">Hello World! I&apos;m <tspan fill="#213448" font-weight="700">Zaka</tspan>, a full-stack engineer.</text>
    <text x="530" y="154" class="muted" font-size="17">I build quiet systems behind busy operations.</text>
    <text x="110" y="230" class="muted" font-size="15" letter-spacing="2">FIRST PANEL · LOGO SOURCE</text>
    <text x="110" y="770" class="muted" font-size="14" letter-spacing="1.5">Scroll / swipe to continue</text>
  </g>

  <!-- Next About panel -->
  <rect x="966" y="52" width="580" height="796" rx="26" fill="url(#aboutGlow)" stroke="#dce1eb"/>
  <g class="ui">
    <text x="1020" y="126" class="muted" font-size="14" letter-spacing="3">02 / ABOUT</text>
    <text x="1020" y="238" font-size="50" font-weight="420" letter-spacing="-3" fill="#26384a">I build the</text>
    <text x="1020" y="290" font-size="50" font-weight="420" letter-spacing="-3" fill="#26384a">quiet systems</text>
    <text x="1020" y="342" font-size="50" font-weight="420" letter-spacing="-3" fill="#26384a">behind busy</text>
    <text x="1020" y="394" font-size="50" font-weight="420" letter-spacing="-3" fill="#26384a">operations.</text>
    <text x="1020" y="758" class="muted" font-size="14" letter-spacing="1.5">ABOUT PANEL · LOGO LANDING</text>
  </g>

  <!-- Motion guide, intentionally subtle -->
  <path class="trail" d="M245 650 C520 615 700 450 1110 215" fill="none" stroke="#1769ff" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 16"/>

  <!-- Landing logo -->
  <g class="target-logo" transform="translate(1390 116) scale(.39)" opacity="0" filter="url(#softShadow)">
    <g transform="translate(0 0)">
      <rect width="116" height="116" rx="13" fill="#050505"/>
      <text x="14" y="82" fill="#fff" font-size="69" font-weight="700" letter-spacing="-6" class="ui">Za</text>
    </g>
    <g transform="translate(128 0)">
      <rect width="116" height="116" rx="13" fill="#050505"/>
      <text x="13" y="80" fill="#fff" font-size="61" font-weight="700" letter-spacing="-7" class="ui">&lt;/&gt;</text>
    </g>
  </g>

  <!-- Moving logo -->
  <g transform="translate(160 520)">
    <g class="logo-flight-shadow" opacity=".28" filter="url(#softShadow)">
      <g transform="translate(10 14)">
        <rect width="116" height="116" rx="13" fill="#050505"/>
        <text x="14" y="82" fill="#fff" font-size="69" font-weight="700" letter-spacing="-6" class="ui">Za</text>
        <g transform="translate(128 0)">
          <rect width="116" height="116" rx="13" fill="#050505"/>
          <text x="13" y="80" fill="#fff" font-size="61" font-weight="700" letter-spacing="-7" class="ui">&lt;/&gt;</text>
        </g>
      </g>
    </g>
    <g class="logo-flight" filter="url(#shadow)">
      <rect width="116" height="116" rx="13" fill="#050505"/>
      <text x="14" y="82" fill="#fff" font-size="69" font-weight="700" letter-spacing="-6" class="ui">Za</text>
      <g transform="translate(128 0)">
        <rect width="116" height="116" rx="13" fill="#050505"/>
        <text x="13" y="80" fill="#fff" font-size="61" font-weight="700" letter-spacing="-7" class="ui">&lt;/&gt;</text>
      </g>
    </g>
  </g>
</svg>
