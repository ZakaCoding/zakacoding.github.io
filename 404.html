    <script>
      // Safari can inspect the manifest before React mounts. Select the
      // operator manifest synchronously so Add to Home Screen installs Desk.
      (() => {
        const route = `${window.location.pathname}${window.location.hash}`;
        const isOperatorRoute = route.includes('#/operator') || route.startsWith('/operator');
        const manifest = document.createElement('link');
        manifest.id = 'site-manifest';
        manifest.rel = 'manifest';
        manifest.href = isOperatorRoute ? '/operator.webmanifest' : '/portfolio.webmanifest';
        document.head.appendChild(manifest);

        if (isOperatorRoute) {
          const title = document.createElement('meta');
          title.name = 'apple-mobile-web-app-title';
          title.content = 'Zaka Desk';
          document.head.appendChild(title);
        }
      })();
    </script>
